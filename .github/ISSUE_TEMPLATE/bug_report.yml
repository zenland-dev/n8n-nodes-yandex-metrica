name: Bug report
description: Something in the node behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Issues here are public. Remove the OAuth token, the measurement token and any
        visitor data before pasting anything — a ClientID and an email address in a
        sample row are personal data.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The n8n version and the version of this package.
      placeholder: "n8n 2.3.1, n8n-nodes-yandex-metrica 0.0.5"
    validations:
      required: true

  - type: dropdown
    id: resource
    attributes:
      label: Which resource
      options:
        - Report
        - Log
        - Counter
        - Goal
        - Segment
        - Filter
        - Operation
        - Annotation
        - Access
        - Offline Conversion
        - Call
        - Chat
        - Advertising Cost
        - Visitor Parameter
        - CRM Contact
        - CRM Order
        - Event (Measurement Protocol)
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Operation
      placeholder: "Get Table"
    validations:
      required: true

  - type: dropdown
    id: credential
    attributes:
      label: Which credential
      options:
        - Yandex Metrica API (pasted token)
        - Yandex Metrica OAuth2 API
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: What Metrica answered
      description: >
        The error body, not only the status code. Metrica names the cause in
        errors[0].error_type, and that field is what turns a bare "Access is denied"
        into something actionable.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        For a report: the metrics, dimensions and date range, which matter more than
        anything else. For Logs API: the request status and how much of the 10 GB
        storage the counter had left. For an upload: the column names of the file.
