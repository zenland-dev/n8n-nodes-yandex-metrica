name: Feature request
description: A missing endpoint, field or convenience
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The workflow you are building, not only the API call you are missing.
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: The Metrica method, if you know it
      placeholder: "GET /management/v1/counter/{counterId}/access_filters"

  - type: textarea
    id: docs
    attributes:
      label: Where it is documented
      description: >
        A link to the page on yandex.ru/dev/metrika. Fifteen management methods were
        left out of the first version on purpose — accounts, delegates, access filters,
        undeleting a counter, the client list and the Yandex Cloud export — so if yours
        is one of those, say what you need it for and it can be added.
